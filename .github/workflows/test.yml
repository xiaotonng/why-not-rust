name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The skill and its renderer are pure standard library. Testing the
        # oldest version we claim to support and the newest stable one keeps
        # that honest.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        # There are no project dependencies; pytest is only the runner the
        # README tells contributors to use, so CI exercises that same path.
        run: python -m pip install --disable-pip-version-check --quiet pytest

      - name: Run the suite
        run: python -m pytest tests/ -q

      - name: Reports must re-render byte-identically
        # The committed HTML is the published artifact. If a case module or the
        # template changes without a re-render, the gallery silently disagrees
        # with its own sources — this is the check that catches it.
        run: |
          python3 examples/build_cases.py
          python3 examples/build_index.py
          python3 tests/render_sample.py
          if ! git diff --exit-code --stat; then
            echo "::error::Rendered output differs from what is committed. Run examples/build_cases.py, examples/build_index.py and tests/render_sample.py, then commit the result."
            exit 1
          fi

      - name: Reports must stay self-contained
        # A report that reaches for a CDN, a webfont or a remote image stops
        # being an artifact you can archive, mail or open offline.
        run: |
          python3 - <<'PY'
          import glob, json, re, sys
          bad = []
          for path in sorted(glob.glob("examples/*.html")):
              html = open(path, encoding="utf-8").read()
              external = re.findall(
                  r'<(?:img|script|iframe|source|video|audio)[^>]+src='
                  r'|<link[^>]+rel=["\']?stylesheet'
                  r'|@import'
                  r'|url\(\s*["\']?https?:', html)
              handlers = set(re.findall(r'\son(\w+)=', html)) - {"click"}
              if external:
                  bad.append(f"{path}: {len(external)} external resource(s)")
              if handlers:
                  bad.append(f"{path}: unexpected inline handlers {sorted(handlers)}")
              if path.endswith("-why-not-rust.html"):
                  if html.count("<script") != 1:
                      bad.append(f"{path}: expected exactly one inert script")
                  record = re.search(
                      r'id="why-not-rust-assessment">\s*(.*?)\s*</script>', html, re.S)
                  if not record:
                      bad.append(f"{path}: assessment record missing")
                  else:
                      json.loads(record.group(1))
                      if re.search(r"[一-鿿]", record.group(1)):
                          bad.append(f"{path}: the machine record must stay English")
                  en, zh = html.count('data-l="en"'), html.count('data-l="zh"')
                  if en != zh:
                      bad.append(f"{path}: {en} English spans vs {zh} Chinese")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY
